<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز المحادثات الفورية - AdVault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit & Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
            background-color: #f8fafc;
        }

        .chat-container {
            height: calc(100vh - 100px);
        }

        .glassmorphism {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .chat-bubble-sender {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border-bottom-left-radius: 1.5rem;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        .chat-bubble-recipient {
            background-color: #f1f5f9;
            color: #1e293b;
            border-bottom-right-radius: 1.5rem;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }
    </style>
</head>

<body class="bg-slate-50 flex flex-col min-h-screen">

    <!-- الشريط العلوي (Header) -->
    <header class="bg-white shadow-sm border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center gap-3">
            <span class="text-2xl">💬</span>
            <div>
                <h1 class="text-lg font-black text-slate-800">مركز المحادثات المباشرة</h1>
                <p class="text-[10px] text-slate-400 font-bold" id="chat-user-role-badge">جاري تحميل الجلسة...</p>
            </div>
        </div>
        
        <button onclick="goBackToDashboard()" 
            class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs py-2 px-4 rounded-xl transition cursor-pointer flex items-center gap-1.5 shadow-sm">
            🔙 العودة للوحة التحكم
        </button>
    </header>

    <!-- حاوية المحادثات الرئيسية -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 flex gap-4 chat-container">
        
        <!-- القائمة الجانبية (لأصحاب الخدمات لرؤية كل الزبائن) -->
        <section id="chat-sidebar" class="w-80 bg-white rounded-3xl border border-slate-150 flex flex-col overflow-hidden hidden md:flex shadow-sm">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <h3 class="font-black text-xs text-slate-500 uppercase tracking-wider">الزبائن والمحادثات النشطة</h3>
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-slate-100" id="chat-channels-list">
                <div class="p-8 text-center text-slate-400 font-bold text-xs">لا توجد محادثات نشطة حالياً.</div>
            </div>
        </section>

        <!-- صندوق المحادثة المفتوح (الدردشة) -->
        <section class="flex-1 bg-white rounded-3xl border border-slate-150 flex flex-col overflow-hidden shadow-sm relative">
            
            <!-- معلومات الطرف الآخر للزبون أو الشريك -->
            <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center" id="chat-active-header">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center font-bold text-indigo-700 text-base" id="active-user-avatar">💬</div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm" id="active-chat-partner-name">اختر محادثة للبدء</h4>
                        <p class="text-[10px] text-indigo-600 font-bold" id="active-chat-service-title">-</p>
                    </div>
                </div>
                
                <!-- شارة حالة تليجرام الطرف الآخر -->
                <div id="partner-telegram-badge" class="text-[9px] font-bold px-2 py-0.5 rounded-md hidden"></div>
            </div>

            <!-- الرسائل -->
            <div class="flex-1 p-5 overflow-y-auto space-y-4" id="chat-messages-box">
                <div class="h-full flex flex-col items-center justify-center text-slate-400 space-y-2">
                    <span class="text-4xl animate-bounce">💬</span>
                    <p class="font-bold text-xs">يرجى اختيار أحد الزبائن أو الطلبات لبدء المحادثة.</p>
                </div>
            </div>

            <!-- قسم معاينة الملف المختار قبل إرساله -->
            <div id="chat-file-preview-bar" class="hidden bg-indigo-50 border-t border-indigo-100 p-2 px-4 flex justify-between items-center text-xs text-indigo-850 font-bold transition-all">
                <div class="flex items-center gap-2">
                    <span class="text-base">📎</span>
                    <span id="preview-file-name" class="truncate max-w-xs">-</span>
                    <span id="preview-file-size" class="text-[9px] text-gray-400 font-mono">(-)</span>
                </div>
                <button type="button" onclick="cancelSelectedFile()" class="text-red-500 hover:text-red-700 text-sm font-bold cursor-pointer">✕ إلغاء</button>
            </div>

            <!-- مربع إرسال الرسالة -->
            <form id="chat-input-form" onsubmit="sendMessage(event)" class="p-4 border-t border-slate-100 bg-white flex gap-3 items-center hidden">
                <button type="button" onclick="triggerFileInput()" class="bg-slate-100 hover:bg-slate-200 text-slate-650 p-3 rounded-2xl transition cursor-pointer flex items-center justify-center text-base" title="إرفاق ملف أو إثبات">
                    📎
                </button>
                <input type="file" id="chat-file-input" class="hidden" onchange="handleFileSelection(event)">

                <input type="text" id="chat-message-text" placeholder="اكتب رسالتك هنا..." autocomplete="off"
                    class="flex-1 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition bg-slate-50/50">
                <button type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 px-6 rounded-2xl transition cursor-pointer flex items-center gap-1.5 shadow-md shadow-indigo-600/10">
                    <span>إرسال</span>
                    <span>✈️</span>
                </button>
            </form>

        </section>

    </main>

    <!-- Supabase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/chat.js"></script>
</body>

</html>
