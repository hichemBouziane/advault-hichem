<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdVault — شحن الرصيد</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/client.css">
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-white shadow-sm border-b border-gray-100 px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-gray-800" id="user-welcome">بوابة شحن الرصيد</h1>
            <span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded-md font-semibold">بوابة العميل التجاري</span>
        </div>
        <button onclick="window.location.href='client.html'"
            class="bg-purple-50 hover:bg-purple-100 text-purple-600 font-bold px-4 py-2 rounded-xl text-sm transition cursor-pointer">
            🔙 رجوع للوحة التحكم
        </button>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden text-right border border-gray-100">
            <div class="bg-gradient-to-br from-purple-700 to-purple-900 p-6 text-white text-center">
                <div class="text-4xl mb-1">💳</div>
                <h3 class="font-bold text-xl">تفاصيل الدفع</h3>
                <p class="text-xs text-purple-200 mt-1">انسخ الـ ID وأرسل المبلغ عبر Redotpay</p>
            </div>
            <div class="p-6 space-y-5">
                <div class="bg-purple-50 border border-purple-200 rounded-2xl p-4 text-center">
                    <p class="text-xs text-gray-500 mb-1 font-medium">رقم بطاقة Redotpay</p>
                    <p id="redotpay-id" class="text-lg font-bold text-purple-800 tracking-widest">— — — —</p>
                    <button onclick="copyRedotpayId(event)"
                        class="mt-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-1.5 rounded-xl cursor-pointer transition">
                        📋 نسخ الـ ID
                    </button>
                </div>
                <div class="bg-red-50 border border-red-100 rounded-2xl p-4 text-center">
                    <p class="text-xs text-gray-500 mb-2">المبلغ المستحق حالياً</p>
                    <div id="modal-balance">
                        <span class="text-2xl font-bold text-red-600">0 دج</span>
                    </div>
                </div>

                <!-- نموذج إرسال طلب الشحن -->
                <div class="border-t border-gray-100 pt-4 space-y-4">
                    <p class="text-xs font-bold text-gray-700">✍️ تقديم طلب شحن جديد:</p>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">المبلغ المراد شحنه ($)</label>
                        <input type="number" id="deposit-amount-usd" min="1" step="any" placeholder="أدخل القيمة بالدولار (مثال: 50)" required
                            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-600 text-xs">
                        <p class="text-[9px] text-gray-400 mt-1 font-semibold">المبلغ المقابل بالدينار: <span id="deposit-dzd-preview" class="text-emerald-600 font-extrabold text-[11px]">0 دج</span></p>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">صورة إثبات الدفع (لقطة شاشة)</label>
                        <input type="file" id="deposit-screenshot" accept="image/*" required
                            class="w-full px-2 py-1.5 rounded-xl border border-gray-200 text-[10px] bg-gray-50 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer">
                    </div>

                    <button id="submit-deposit-btn" onclick="submitDepositRequest()"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition cursor-pointer flex items-center justify-center gap-1">
                        🚀 إرسال طلب الشحن للتأكيد
                    </button>
                </div>

                <div class="border-t border-gray-100 pt-4 space-y-2">
                    <p class="text-[11px] font-bold text-gray-500 mb-1 flex items-center gap-1">
                        <span>🛡️</span> خيارات شحن بديلة:
                    </p>
                    <button id="agent-contact-btn" onclick="requestAgentService()" 
                       class="w-full bg-[#25D366] hover:bg-[#20ba59] text-white font-bold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-[10px] shadow-md shadow-green-600/10 cursor-pointer">
                        تواصل مع الوكلاء لشراء الدولار بالعاصمة
                    </button>
                </div>

                <button onclick="window.location.href='client.html'"
                    class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2.5 rounded-xl text-sm transition cursor-pointer">
                    رجوع
                </button>
            </div>
        </div>
    </main>

    <script src="js/recharge.js?v=1.4"></script>
</body>

</html>
