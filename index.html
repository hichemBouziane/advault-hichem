<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للمنصة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">تسجيل الدخول للمنصة</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-600">رقم الهاتف</label>
                <input type="text" id="login-phone" placeholder="0XXXXXXXXX" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-600">كلمة السر</label>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md cursor-pointer">دخول</button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uljdazwcjxogpymvbflq.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DGoBEde67ewtWtMlC4Nx9w_cuvSAmUc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorElement = document.getElementById('login-error');

            if(!phone || !password) {
                errorElement.innerText = "يرجى ملء جميع الحقول";
                errorElement.classList.remove('hidden');
                return;
            }

            const { data, error } = await _supabase
                .from('clients')
                .select('*')
                .eq('phone', phone)
                .eq('password', password)
                .single();

            if (error || !data) {
                errorElement.innerText = "رقم الهاتف أو كلمة السر غير صحيحة";
                errorElement.classList.remove('hidden');
            } else {
                localStorage.setItem('currentUser', JSON.stringify(data));
                if(data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'client.html';
                }
            }
        }
    </script>
</body>
</html>
