<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للمنصة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/index.css">
    <!-- PWA: AdVault -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6D28D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AdVault">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-indigo-600 mb-6">تسجيل الدخول للمنصة</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-600">رقم الهاتف</label>
                <input type="text" id="login-phone" placeholder="0XXXXXXXXX" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-600">كلمة السر</label>
                <input type="password" id="login-password" placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="handleLogin()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md cursor-pointer">
                دخول
            </button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/index.js"></script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('[AdVault] SW registered:', reg.scope))
        .catch(err => console.warn('[AdVault] SW failed:', err));
    });
  }
</script>
</body>
</html>
