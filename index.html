<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdVault — تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/index.css">
    <!-- PWA: AdVault -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AdVault">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
    
    <!-- الخلفية الزخرفية -->
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- صندوق تسجيل الدخول -->
    <div class="bg-white/90 p-8 sm:p-10 rounded-[2rem] shadow-2xl w-full max-w-md border border-white/50 backdrop-blur-xl relative z-10">
        
        <!-- الشعار -->
        <div class="flex justify-center mb-6">
            <img src="icons/icon-192.png" alt="AdVault Logo" class="w-24 h-24 object-contain drop-shadow-sm">
        </div>
        
        <!-- العناوين -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 tracking-tight">AdVault</h1>
            <p class="text-gray-500 text-sm font-medium">المنصة الرائدة لإدارة حملاتك الإعلانية</p>
        </div>

        <!-- الفورم -->
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">رقم الهاتف</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    </div>
                    <input type="text" id="login-phone" placeholder="0XXXXXXXXX"
                        class="w-full pr-12 pl-4 py-3.5 rounded-2xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">كلمة السر</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="login-password" placeholder="••••••••"
                        class="w-full pr-12 pl-4 py-3.5 rounded-2xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200">
                </div>
            </div>
            
            <button onclick="handleLogin()"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3.5 rounded-2xl transition-all duration-300 shadow-lg shadow-indigo-200 cursor-pointer transform hover:-translate-y-0.5 mt-2">
                تسجيل الدخول
            </button>
            <p id="login-error" class="text-red-600 bg-red-50 p-3 rounded-xl border border-red-100 text-sm font-bold text-center hidden mt-4"></p>
        </div>
        
        <!-- التذييل -->
        <div class="mt-8 text-center">
            <p class="text-xs text-gray-400 font-medium">نظام محمي لعملاء ووكلاء المنصة &copy; 2026</p>
        </div>
    </div>

    <!-- سكربتات التطبيق -->
    <script src="js/index.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('[AdVault] SW registered:', reg.scope))
                    .catch(err => console.warn('[AdVault] SW failed:', err));
            });
        }
        
        // دعم الدخول بالضغط على Enter
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
</body>

</html>
