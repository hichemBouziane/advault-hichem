            // Theme State
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('theme');
                return saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);

            const [isLoginOpen, setIsLoginOpen] = useState(false);
            const [showPassword, setShowPassword] = useState(false);

            // Calculator State
            const [budget, setBudget] = useState(5); // Daily USD Budget
            const [exchangeRate, setExchangeRate] = useState(230); // DZD Exchange Rate
            
            // Calculate components
            const commissionRate = 0.20; // 20%
            const feeUSD = budget * commissionRate;
            const totalUSD = budget * (1 + commissionRate);
            const totalDZD = totalUSD * exchangeRate;

            // Apply Dark Mode Class
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            // Auto-focus logic for modal inputs when opened
            useEffect(() => {
                if (isLoginOpen) {
                    const phoneInput = document.getElementById('login-phone');
                    if (phoneInput) phoneInput.focus();
                }
            }, [isLoginOpen]);

            // Handle standard login process trigger
            const triggerLoginSubmit = () => {
                if (typeof window.handleLogin === 'function') {
                    window.handleLogin();
                }
            };

            return (
